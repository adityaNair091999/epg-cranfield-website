# ---------------------------------------------------------------------------
# Netlify configuration for the Energy and Power Group website (Astro static)
# ---------------------------------------------------------------------------

[build]
  # Command Netlify runs to build the site.
  command = "npm run build"
  # Folder Astro outputs the finished site into.
  publish = "dist"

[build.environment]
  # Pin the Node version Netlify uses to build.
  NODE_VERSION = "22"

# Nice-to-have security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Environment variables to set in the Netlify dashboard
# (Site configuration -> Environment variables) so the build reads live Sanity:
#
#   SANITY_PROJECT_ID   = 7hpg0m0e        (your Sanity project ID)
#   SANITY_DATASET      = production
#   SANITY_API_TOKEN    = <read token>    (optional; only needed if the dataset
#                                          is set to private — see README step 3)
#
# The code also accepts the PUBLIC_SANITY_* variants used in local development.
# ---------------------------------------------------------------------------
