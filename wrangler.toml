# Cloudflare deployment config — serves the built static site (dist/) as
# static assets via `npx wrangler deploy`. No server code; assets only.
name = "epg-cranfield-website"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"

# Required by `npx wrangler preview`, which Cloudflare runs for PR preview
# builds. Empty = previews inherit the settings above.
[previews]
